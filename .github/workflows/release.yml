name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      # The WMO RAF fork's own releases, e.g. v0.8.1-wmo.1: upstream's version
      # plus the revision of this fork's changes on top of it.
      - 'v[0-9]+.[0-9]+.[0-9]+-wmo.[0-9]+'

jobs:
  release:
    name: Release ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          # Only the services GeoRiva deploys (georiva-publisher-forti,
          # deploy/compose.yml). The rest build from the same tree and can be
          # added back here when something needs them.
          - jsonfrontend
          - rawdataforecaster
    steps:
      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.service }}
          # `v`-prefixed, as deploy/compose.yml names them. A pre-release such
          # as v0.8.1-wmo.1 gets only the full version: metadata-action does
          # not emit the floating major / major.minor tags for one, so a
          # revision of the fork never moves `v0` or `v0.8`.
          tags: |
            type=semver,pattern=v{{version}}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/build/package/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
